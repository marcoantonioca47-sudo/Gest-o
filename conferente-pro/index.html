/* Visual refinements: depth, responsive cards and clear touch feedback */
:root{--card-shadow:0 8px 18px rgba(16,36,58,.07),0 2px 5px rgba(16,36,58,.04);--card-shadow-hover:0 16px 30px rgba(16,36,58,.13),0 5px 10px rgba(16,36,58,.07);--card-shadow-pressed:inset 0 3px 8px rgba(16,36,58,.18),0 1px 2px rgba(16,36,58,.08)}

<header class="top"><div class="brand"><div class="logo">▦</div><div><h1>CONFERENTE PRO</h1><p>Planejamento e controle do CD</p></div></div><div><button id="settings" class="btn small">⚙ Conexão</button><button id="logout" class="btn small hidden">Sair</button></div></header>
<div id="auth"></div><div id="app" class="hidden"><div class="layout"><aside><nav class="nav"><button data-page="dashboard" class="active">▦　Painel geral</button><button data-page="tasks">☷　Tarefas</button><button data-page="calendar">▦　Cronograma</button><button data-page="operators">♙　Operadores</button><button data-page="history">↺　Histórico</button></nav><p class="muted" style="padding:10px">Um CD · Uma operação</p></aside><main id="main" class="main"></main></div><nav class="mobile"><button data-page="dashboard">▦<br>Painel</button><button data-page="tasks">☷<br>Tarefas</button><button data-page="calendar">▦<br>Agenda</button><button data-page="operators">♙<br>Equipe</button><button data-page="history">↺<br>Histórico</button></nav></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';
const TYPES=['Cross-docking','Transferências de estoque','Separação de materiais','Conferência de cargas','Carregamento e expedição'],ST=['Aguardando','Iniciado','Finalizado','Expedido'],CFG='conferente-pro-supabase';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)},today=()=>iso(new Date()),date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
let db=null,session=null,tasks=[],ops=[],opRoles={},hist=[],page='dashboard',view='week',cursor=new Date(),search='',fs='',ft='',fo='',taskCategory='',dashboardType=TYPES[0];
const DEFAULT_CFG={url:'https://xjuflayzkekxbnrjkgys.supabase.co',key:'sb_publishable_rf7vayvmfv8KqH2OpJRwXg_RGRUMuzE'};function cfg(){try{const saved=JSON.parse(localStorage.getItem(CFG)||'{}');return {url:(saved.url||'').trim()||DEFAULT_CFG.url,key:(saved.key||'').trim()||DEFAULT_CFG.key}}catch{return DEFAULT_CFG}}function toast(s){$('#toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#toast').innerHTML='',2800)}
function modal(title,body){$('#modal').innerHTML='<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h3>'+title+'</h3><button class="close" id="close">×</button></div>'+body+'</div></div>';$('#close').onclick=()=>$('#modal').innerHTML='';$('#back').onclick=e=>{if(e.target.id==='back')$('#modal').innerHTML=''}}
function late(t){return !['Finalizado','Expedido','Concluído','Cancelado'].includes(normalizedStatus(t.status))&&t.date<today()}function pill(t){let c=['Finalizado','Expedido','Concluído'].includes(normalizedStatus(t.status))?'done':late(t)?'late':['Iniciado','Em andamento'].includes(normalizedStatus(t.status))?'progress':normalizedStatus(t.status)==='Aguardando'?'wait':'';return '<span class="pill '+c+'">'+(late(t)?'Atrasado':esc(normalizedStatus(t.status)))+'</span>'}
async function audit(action,t){let {error}=await db.from('cp_history').insert({action,task_title:t.title||t.name||'Operador',task_type:t.type||null,operator_name:t.operator||t.name||null,created_at:new Date().toISOString()});if(error)console.warn(error)}
async function refresh(){if(!db||!session)return;try{let [a,b,c]=await Promise.all([db.from('cp_tasks').select('*').order('date').order('time'),db.from('cp_operators').select('*').order('name'),db.from('cp_history').select('*').order('created_at',{ascending:false}).limit(500)]);if(a.error)throw a.error;if(b.error)throw b.error;if(c.error)throw c.error;tasks=a.data||[];opRoles=Object.fromEntries((b.data||[]).map(x=>[x.name,x.role||'Operador']));ops=(b.data||[]).map(x=>x.name);hist=c.data||[];render()}catch(e){toast('Erro ao carregar dados: '+e.message)}}
function head(t,d,add=true){return '<div class="head"><div><h2>'+t+'</h2><p>'+d+'</p></div>'+(add?'<button class="btn primary" id="new">＋ Nova tarefa</button>':'')+'</div>'}
function rows(arr){if(!arr.length)return '<div class="empty"><b>Nenhuma tarefa encontrada</b>Cadastre uma tarefa ou ajuste os filtros.</div>';return '<div class="tablewrap"><table><thead><tr><th>Tarefa / operação</th><th>Romaneio / separação</th><th>Operador ou conferente</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+arr.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).map(t=>'<tr><td><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.type)+'</div></td><td>'+(t.code?esc(t.code):'—')+'</td><td>'+esc(t.operator||'Não atribuído')+'</td><td>'+esc(t.priority||'Normal')+'</td><td>'+pill(t)+'</td><td><button class="btn small" data-edit="'+t.id+'">Editar</button> <button class="btn small" data-status="'+t.id+'">'+statusAction(t)+'</button> <button class="btn small danger" data-del="'+t.id+'">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}
function filtered(){return tasks.filter(t=>(!taskCategory||t.type===taskCategory)&&(!search||[t.title,t.type,t.operator,t.code,t.notes].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!fs||t.status===fs||fs==='Atrasado'&&late(t))&&(!ft||t.type===ft)&&(!fo||t.operator===fo))}
function filters(){return '<div class="filters"><input class="search" id="search" placeholder="Buscar tarefa, romaneio, operador..." value="'+esc(search)+'"><select id="fs" class="search"><option value="">Todos os status</option>'+[...ST,'Atrasado'].map(x=>'<option '+(fs===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="ft" class="search"><option value="">Todos os tipos</option>'+TYPES.map(x=>'<option '+(ft===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="fo" class="search"><option value="">Todos os operadores</option>'+ops.map(x=>'<option '+(fo===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}
function dashboard(){let pending=tasks.filter(t=>!['Concluído','Cancelado'].includes(t.status)),done=tasks.filter(t=>['Finalizado','Expedido'].includes(normalizedStatus(t.status)));return head('Painel geral','Resumo das tarefas do centro de distribuição.')+'<div class="panel"><div class="field"><label>Tipo da nova tarefa</label><select id="dashboardType">'+TYPES.map(x=>'<option '+(dashboardType===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><small class="muted">Essa escolha vale somente para criar tarefas pelo Painel geral.</small></div></div><div class="stats">'+[['Tarefas de hoje',tasks.filter(t=>t.date===today()&&!['Cancelado','Expedido'].includes(normalizedStatus(t.status))).length,'Programadas para hoje'],['Concluídas',done.length,(tasks.length?Math.round(done.length/tasks.length*100):0)+'% do total'],['Em andamento',tasks.filter(t=>normalizedStatus(t.status)==='Iniciado').length,'Em execução'],['Atrasadas',tasks.filter(late).length,'Precisam de atenção']].map(x=>'<div class="stat"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('')+'</div><div class="panel"><div class="panelhead"><h3>Prioridades de hoje e atrasadas</h3><button class="btn small" data-goto="tasks">Ver todas</button></div>'+rows(pending.filter(t=>t.date<=today()||['Em andamento','Aguardando'].includes(t.status)).slice(0,8))+'</div><div class="panel"><div class="panelhead"><h3>Próximas tarefas · 7 dias</h3></div>'+rows(pending.filter(t=>t.date>=today()).slice(0,6))+'</div>'}
function taskPage(){if(!taskCategory){let icons=['↔️','📦','☷','✓','🚚'],descs=['Entrada e saída rápida de mercadorias','Movimentação entre estoques','Separação de itens e materiais','Validação de cargas e documentos','Preparação e liberação de veículos'];return head('Tarefas','Escolha o tipo de operação para abrir as tarefas.',false)+'<div class="typecards">'+TYPES.map((x,i)=>'<button class="typecard" data-typecard="'+esc(x)+'"><span class="typeicon">'+icons[i]+'</span><span><strong>'+esc(x)+'</strong><small>'+descs[i]+'</small></span></button>').join('')+'</div>'}return '<div class="head"><div><h2>'+esc(taskCategory)+'</h2><p>Tarefas desta operação.</p></div><div class="actions" style="margin-top:0"><button class="btn" id="backtypes">← Todas as operações</button><button class="btn primary" id="new">＋ Nova tarefa</button></div></div><div class="panel">'+filters()+rows(filtered())+'</div>'}
function calendarPage(){const calendarTasks=tasks.filter(t=>['Cross-docking','Transferências de estoque'].includes(t.type));let start=new Date(cursor),title;if(view==='month'){start=new Date(cursor.getFullYear(),cursor.getMonth(),1);start.setDate(start.getDate()-start.getDay());title=cursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}else if(view==='week'){start.setDate(start.getDate()-start.getDay());let end=new Date(start);end.setDate(end.getDate()+6);title=date(iso(start))+' – '+date(iso(end))}else title=date(iso(start));let out=head('Cronograma','Veja as tarefas por dia, semana ou mês.')+'<div class="panel"><div class="panelhead"><div class="viewtabs">'+['day','week','month'].map(x=>'<button data-view="'+x+'" class="'+(view===x?'active':'')+'">'+({day:'Dia',week:'Semana',month:'Mês'}[x])+'</button>').join('')+'</div><div class="datebar"><button class="btn small" id="prev">‹</button><strong>'+title+'</strong><button class="btn small" id="next">›</button><button class="btn small" id="now">Hoje</button></div></div>';
if(view==='day'){let daily=calendarTasks.filter(t=>t.date===iso(start)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));out+='<div class="agenda-day-title"><span>📅 Agenda de '+date(iso(start))+'</span><span>'+daily.length+' tarefa(s)</span></div>'+rows(daily)}else if(view==='week'){out+='<div class="weekscroll"><div class="week">'+Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let k=iso(d);return '<div class="weekday"><b>'+d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+'</b>'+calendarTasks.filter(t=>t.date===k).map(t=>'<div class="weektask"><b>'+esc(t.time||'')+' '+esc(t.title)+'</b>'+esc(t.operator||'Sem operador')+'<br>'+pill(t)+'<br><button class="btn small" data-edit="'+t.id+'">Abrir</button></div>').join('')+'<button class="btn small" data-add="'+k+'">＋ Tarefa</button></div>'}).join('')+'</div></div>'}else{out+='<div class="calwrap"><div class="calendar">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dayhead">'+x+'</div>').join('')+Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d);return '<div class="day '+(d.getMonth()!==cursor.getMonth()?'out':'')+'"><b>'+d.getDate()+'</b>'+calendarTasks.filter(t=>t.date===k).slice(0,4).map(t=>'<button class="event" data-edit="'+t.id+'">'+esc((t.time?t.time+' ':'')+t.title)+'</button>').join('')+'<button class="btn small" data-add="'+k+'">＋</button></div>'}).join('')+'</div></div>'}return out+'</div>'}
function operatorPage(){return head('Equipe','Operadores e conferentes cadastrados.',false)+'<div class="panel"><div class="panelhead"><h3>Equipe do CD</h3><button id="newop" class="btn primary">＋ Cadastrar pessoa</button></div>'+(!ops.length?'<div class="empty">Nenhuma pessoa cadastrada.</div>':'<div class="ops">'+ops.map(o=>{let a=tasks.filter(t=>t.operator===o),d=a.filter(t=>['Finalizado','Expedido'].includes(normalizedStatus(t.status))).length;return '<div class="op"><b>'+esc(o)+'</b><p class="muted">'+esc(opRoles[o]||'Operador')+' · '+a.length+' tarefas · '+d+' finalizadas</p><button class="btn small" data-op="'+esc(o)+'">Ver tarefas</button> <button class="btn small danger" data-remove="'+esc(o)+'">Remover</button></div>'}).join('')+'</div>')+'</div>'}
function historyPage(){return head('Histórico','Registro de alterações nas tarefas.',false)+'<div class="panel"><div class="panelhead"><h3>Atividades recentes</h3><button class="btn small" id="csv">Exportar tarefas CSV</button></div>'+(!hist.length?'<div class="empty">Ainda não há alterações registradas.</div>':hist.map(h=>'<div class="history"><b>'+esc(h.action)+'</b> — '+esc(h.task_title||h.operator_name||'Tarefa')+'<div class="muted">'+esc(h.task_type||'')+' '+(h.operator_name?'· '+esc(h.operator_name):'')+' · '+new Date(h.created_at).toLocaleString('pt-BR')+'</div></div>').join(''))+'</div>'}
function render(){if(!session)return;$('#auth').innerHTML='';$('#app').classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#main').innerHTML=({dashboard,tasks:taskPage,calendar:calendarPage,operators:operatorPage,history:historyPage}[page]||dashboard)();wire()}
function wire(){if($('#dashboardType'))$('#dashboardType').onchange=e=>{dashboardType=e.target.value};if($('#new'))$('#new').onclick=()=>editTask();if($('#backtypes'))$('#backtypes').onclick=()=>{taskCategory='';render()};document.querySelectorAll('[data-typecard]').forEach(b=>b.onclick=()=>{taskCategory=b.dataset.typecard;render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='tasks')taskCategory='';render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;if(page==='tasks')taskCategory='';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>editTask('',b.dataset.add));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});if($('#prev'))$('#prev').onclick=()=>{cursor=new Date(cursor);cursor.setDate(cursor.getDate()-(view==='day'?1:view==='week'?7:30));render()};if($('#next'))$('#next').onclick=()=>{cursor=new Date(cursor);cursor.setDate(cursor.getDate()+(view==='day'?1:view==='week'?7:30));render()};if($('#now'))$('#now').onclick=()=>{cursor=new Date();render()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>statusTask(b.dataset.status));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.del));if($('#newop'))$('#newop').onclick=editOperator;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeOperator(b.dataset.remove));document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{fo=b.dataset.op;page='tasks';render()});if($('#search'))$('#search').oninput=e=>{search=e.target.value;renderPreserve()};[['fs',v=>fs=v],['ft',v=>ft=v],['fo',v=>fo=v]].forEach(([id,fn])=>{if($('#'+id))$('#'+id).onchange=e=>{fn(e.target.value);render()}});if($('#csv'))$('#csv').onclick=exportCSV}
function renderPreserve(){let pos=$('#search')?.selectionStart;$('#main').innerHTML=taskPage();wire();if($('#search')){$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
function editTask(id='',preset=''){let t=id?tasks.find(x=>x.id===id):null;let allowTypeChoice=page==='dashboard'&&!t;let selectedType=t?.type||(page==='dashboard'?dashboardType:taskCategory)||TYPES[0];let typeField=allowTypeChoice?'<div class="field"><label>Tipo de operação *</label><select name="type" required>'+TYPES.map(x=>'<option '+(selectedType===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><small>Escolha o tipo somente pelo Painel geral.</small></div>':'<div class="field"><label>Tipo de operação</label><input value="'+esc(selectedType)+'" disabled><small>O tipo é definido automaticamente pela aba atual.</small></div>';modal(t?'Editar tarefa':'Nova tarefa','<form id="taskform"><div class="grid"><div class="field full"><label>Nome da tarefa *</label><input name="title" required value="'+esc(t?.title||'')+'" placeholder="Ex.: Conferir carga"></div>'+typeField+'<div class="field"><label>Número do romaneio / separação</label><input name="code" value="'+esc(t?.code||'')+'" placeholder="Ex.: 12345 / 02"></div><div class="field"><label>Operador ou conferente</label><select name="operator"><option value="">Selecione o responsável</option>'+ops.map(o=>'<option '+((t?.operator||'')===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div><div class="field"><label>Prioridade</label><select name="priority">'+['Baixa','Normal','Alta','Urgente'].map(x=>'<option '+((t?.priority||'Normal')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Instruções / observações</label><textarea name="notes">'+esc(t?.notes||'')+'</textarea></div></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Salvar tarefa</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#taskform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p={title:f.get('title').trim(),type:t?.type||(page==='dashboard'?(f.get('type')||dashboardType):(taskCategory||TYPES[0])),code:f.get('code').trim(),date:t?.date||today(),time:t?.time||null,operator:f.get('operator')||null,priority:f.get('priority'),status:t?normalizedStatus(t.status):'Aguardando',notes:f.get('notes').trim(),updated_at:new Date().toISOString()};try{let res;if(t)res=await db.from('cp_tasks').update(p).eq('id',t.id);else{p.created_by=session.user.id;p.created_at=new Date().toISOString();p.status='Aguardando';p.completed_at=null;res=await db.from('cp_tasks').insert(p)}if(res.error)throw res.error;await audit(t?'Tarefa editada':'Tarefa criada',p);$('#modal').innerHTML='';await refresh();toast('Tarefa salva e sincronizada.')}catch(err){toast('Falha ao salvar: '+err.message)}}}
function normalizedStatus(s){return ({'A fazer':'Aguardando','Em andamento':'Iniciado','Concluído':'Finalizado','Cancelado':'Aguardando'}[s]||s||'Aguardando')}
function statusAction(t){let s=normalizedStatus(t.status);return ({'Aguardando':'Iniciar','Iniciado':'Finalizar','Finalizado':'Expedir','Expedido':'Reabrir'})[s]||'Iniciar'}
async function statusTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;let current=normalizedStatus(t.status);let next={'Aguardando':'Iniciado','Iniciado':'Finalizado','Finalizado':'Expedido','Expedido':'Aguardando'};let status=next[current]||'Iniciado';if(current==='Aguardando'&&!t.operator){toast('Antes de iniciar, atribua um operador ou conferente à tarefa.');editTask(t.id);return}if(current==='Iniciado'&&t.type==='Conferência de cargas'){modal('Resultado da conferência','<p style="margin:0 0 16px">A separação estava OK?</p><div class="actions"><button type="button" class="btn" id="conferenceCancel">Cancelar</button><button type="button" class="btn primary" id="conferenceOk">Estava OK</button><button type="button" class="btn danger" id="conferenceNotOk">Não estava OK</button></div>');$('#conferenceCancel').onclick=()=>$('#modal').innerHTML='';$('#conferenceOk').onclick=()=>saveConferenceResult(id,'OK');$('#conferenceNotOk').onclick=()=>saveConferenceResult(id,'NÃO OK');return}try{let {error}=await db.from('cp_tasks').update({status,completed_at:['Finalizado','Expedido'].includes(status)?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;let action=({'Iniciado':'Tarefa iniciada','Finalizado':'Tarefa finalizada','Expedido':'Tarefa expedida','Aguardando':'Tarefa voltou para aguardando'})[status];await audit(action,{...t,status});await refresh();toast(({'Iniciado':'Etapa iniciada.','Finalizado':'Etapa finalizada.','Expedido':'Tarefa expedida.','Aguardando':'Tarefa voltou para aguardando.'})[status])}catch(e){toast(e.message)}}
async function saveConferenceResult(id,result){let t=tasks.find(x=>x.id===id);if(!t)return;let note='Resultado da conferência: '+result;let notes=(t.notes||'').split('\n').filter(x=>!x.startsWith('Resultado da conferência:')).join('\n');notes=notes?[notes,note].join('\n'):note;try{let {error}=await db.from('cp_tasks').update({status:'Finalizado',completed_at:new Date().toISOString(),updated_at:new Date().toISOString(),notes}).eq('id',id);if(error)throw error;$('#modal').innerHTML='';await audit('Conferência finalizada — '+result,{...t,status:'Finalizado',notes});await refresh();toast('Conferência finalizada. Resultado: '+result)}catch(e){toast(e.message)}}
async function deleteTask(id){let t=tasks.find(x=>x.id===id);if(!t||!confirm('Excluir “'+t.title+'”?'))return;try{let {error}=await db.from('cp_tasks').delete().eq('id',id);if(error)throw error;await audit('Tarefa excluída',t);await refresh()}catch(e){toast(e.message)}}
function editOperator(){modal('Cadastrar pessoa da equipe','<form id="opform"><div class="field"><label>Nome completo *</label><input name="name" required></div><div class="field"><label>Função *</label><select name="role" required><option value="Operador">Operador</option><option value="Conferente">Conferente</option></select></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Cadastrar</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#opform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),role=f.get('role');if(ops.some(o=>o.toLowerCase()===name.toLowerCase()))return toast('Essa pessoa já está cadastrada.');let {error}=await db.from('cp_operators').insert({name,role,created_by:session.user.id});if(error)return toast(error.message);await audit(role+' cadastrado',{name});$('#modal').innerHTML='';await refresh()}}
async function removeOperator(name){if(tasks.some(t=>t.operator===name&&!['Concluído','Cancelado'].includes(t.status)))return alert('Reatribua as tarefas pendentes antes de remover.');if(!confirm('Remover '+name+'?'))return;let {error}=await db.from('cp_operators').delete().eq('name',name);if(error)return toast(error.message);await audit('Operador removido',{name});await refresh()}
function exportCSV(){let rows=[['Tarefa','Tipo','Código','Data','Hora','Operador','Prioridade','Status','Observações'],...tasks.map(t=>[t.title,t.type,t.code,t.date,t.time,t.operator,t.priority,t.status,t.notes])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='conferente-pro-tarefas.csv';a.click();URL.revokeObjectURL(a.href)}
function settings(){let c=cfg();modal('Conectar banco compartilhado','<p class="muted">Insira a URL e a chave pública (publishable/anon) de um projeto Supabase do CONFERENTE PRO. Nunca cole a chave service_role. O arquivo supabase-schema.sql cria as tabelas necessárias.</p><form id="cfg"><div class="field"><label>URL do projeto</label><input name="url" type="url" required placeholder="https://projeto.supabase.co" value="'+esc(c.url||'')+'"></div><div class="field" style="margin-top:12px"><label>Chave pública</label><input name="key" required value="'+esc(c.key||'')+'"></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Conectar</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#cfg').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);localStorage.setItem(CFG,JSON.stringify({url:f.get('url').trim().replace(/\/$/,''),key:f.get('key').trim()}));$('#modal').innerHTML='';await connect()}}
function showLogin(){ $('#app').classList.add('hidden');$('#logout').classList.add('hidden');$('#auth').innerHTML='<div class="auth"><h2>Entrar no CONFERENTE PRO</h2><p class="muted">Use uma conta individual para acessar as mesmas tarefas compartilhadas da equipe.</p><form id="login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><div class="actions" style="justify-content:flex-start"><button class="btn primary">Entrar</button><button type="button" class="btn" id="signup">Criar conta</button></div></form><p class="muted" id="msg"></p><button class="btn small" id="config">⚙ Configurar banco</button></div>';$('#config').onclick=settings;$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});$('#msg').textContent=error?error.message:'Entrando…'};$('#signup').onclick=async()=>{let f=new FormData($('#login'));if(!f.get('email')||!f.get('password'))return $('#msg').textContent='Preencha e-mail e senha.';let {error}=await db.auth.signUp({email:f.get('email'),password:f.get('password')});$('#msg').textContent=error?error.message:'Conta criada. Se solicitado, confirme o e-mail e entre.'}}
async function connect(){let c=cfg();if(!c.url||!c.key||!window.supabase){$('#auth').innerHTML='<div class="auth"><h2>Configuração necessária</h2><p>Para o sistema funcionar entre celulares e computadores, conecte um banco compartilhado.</p><button id="setup" class="btn primary">Configurar conexão</button><p class="muted">O site precisa de um projeto Supabase e das tabelas do arquivo supabase-schema.sql.</p></div>';$('#setup').onclick=settings;return}try{db=window.supabase.createClient(c.url,c.key);let {data,error}=await db.auth.getSession();if(error)throw error;session=data.session;db.auth.onAuthStateChange((_e,s)=>{session=s;if(s){$('#auth').innerHTML='';refresh()}else showLogin()});if(session){$('#auth').innerHTML='';$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await refresh()}else showLogin();$('#logout').onclick=async()=>{await db.auth.signOut();session=null;showLogin()}}catch(e){$('#auth').innerHTML='<div class="auth"><h2>Erro de conexão</h2><p>'+esc(e.message)+'</p><button id="again" class="btn primary">Tentar novamente</button></div>';$('#again').onclick=connect}}
$('#settings').onclick=settings;connect();
})();
</script></body></html>
