<style>

ght:700}.value{font-size:30px;font-weight:850;margin:8px 0 3px}.muted{color:var(--muted);font-size:12px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.panelhead h3{margin:0;font-size:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search,.field input,.field select,.field textarea{border:1px solid #d5dfe9;border-radius:8px;padding:11px 12px;width:100%;min-width:0;background:#fff;color:var(--ink)}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#526477}.field textarea{min-height:76px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:690px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf1f5;font-size:13px;vertical-align:middle}th{font-size:10px;color:#7c8b9b;background:#f8fafc;text-transform:uppercase}.pill{display:inline-block;border-radius:20px;padding:5px 8px;font-size:11px;font-weight:800;background:#edf1f5}.done{background:#dcf7e9;color:#13754e}.progress{background:#e5f0ff;color:#205fb0}.wait{background:#fff2d9;color:#985c00}.late{background:#ffe6e7;color:#b52b36}.empty{text-align:center;padding:30px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.viewtabs{display:flex;gap:4px;background:#edf2f7;padding:4px;border-radius:9px}.viewtabs button{border:0;background:transparent;border-radius:7px;padding:8px 10px;font-size:12px}.viewtabs .active{background:#fff;color:#1d5ea9}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.datebar strong{min-width:135px;text-align:center;font-size:12px}.calwrap{overflow-x:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(75px,1fr));min-width:560px;border-top:1px solid var(--line);border-left:1px solid var(--line)}.dayhead,.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}.dayhead{text-align:center;background:#f8fafc;font-size:11px}.day{min-height:86px;background:white}.day.out{background:#f8fafc;color:#aab5c0}.event{display:block;width:100%;text-align:left;border:0;border-radius:5px;background:#e5efff;color:#235da5;font-size:10px;padding:5px;margin:4px 0;overflow-wrap:anywhere}.weekscroll{overflow-x:auto}.week{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:7px;min-width:680px}.weekday{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:7px}.weektask{background:#fff;border:1px solid var(--line);padding:8px;margin:6px 0;border-radius:7px;font-size:11px;overflow-wrap:anywhere}.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.op{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;min-width:0}.history{padding:12px 0;border-bottom:1px solid #edf1f5}.modalback{position:fixed;inset:0;background:#0b192bb3;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}.modal{background:#fff;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{border:0;border-radius:8px;background:#eef2f6;width:38px;height:38px;font-size:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172536;color:white;border-radius:9px;padding:12px;z-index:20;max-width:90vw}.auth{max-width:440px;margin:7vh auto;background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.auth .field{margin:12px 0}.hidden{display:none!important}.mobile{display:none}.note{font-size:12px;color:#775719;background:#fff7e5;border:1px solid #f0dfb6;border-radius:9px;padding:12px;line-height:1.5}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ops{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:5}.mobile button{border:0;background:transparent;font-size:10px;padding:6px 1px;color:#68798b}.mobile button.active{color:#1d61b8;font-weight:800}.main{padding-bottom:100px}}
@media(max-width:560px){.top{padding:13px}.brand h1{font-size:17px}.brand p{font-size:11px}.logo{width:38px;height:38px}.main{padding:14px 10px 100px}.head h2{font-size:23px}.stats{gap:8px}.stat{padding:12px}.value{font-size:25px}.grid,.ops{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:12px}.modal{padding:15px}.btn{padding:10px}.filters>*{flex:1;min-width:120px}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">▦</div><div><h1>CONFERENTE PRO</h1><p>Planejamento e controle do CD</p></div></div><div><button id="settings" class="btn small">⚙ Conexão</button><button id="logout" class="btn small hidden">Sair</button></div></header>
<div id="auth"></div><div id="app" class="hidden"><div class="layout"><aside><nav class="nav"><button data-page="dashboard" class="active">▦　Painel geral</button><button data-page="tasks">☷　Tarefas</button><button data-page="calendar">▦　Cronograma</button><button data-page="operators">♙　Operadores</button><button data-page="history">↺　Histórico</button></nav><p class="muted" style="padding:10px">Um CD · Uma operação</p></aside><main id="main" class="main"></main></div><nav class="mobile"><button data-page="dashboard">▦<br>Painel</button><button data-page="tasks">☷<br>Tarefas</button><button data-page="calendar">▦<br>Agenda</button><button data-page="operators">♙<br>Equipe</button><button data-page="history">↺<br>Histórico</button></nav></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';
const TYPES=['Cross-docking','Transferências de estoque','Separação de materiais','Conferência de cargas','Carregamento e expedição'],ST=['A fazer','Em andamento','Aguardando','Concluído','Cancelado'],CFG='conferente-pro-supabase';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)},today=()=>iso(new Date()),date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
let db=null,session=null,tasks=[],ops=[],hist=[],page='dashboard',view='week',cursor=new Date(),search='',fs='',ft='',fo='';
const DEFAULT_CFG={url:'https://xjuflayzkekxbnrjkgys.supabase.co',key:'sb_publishable_rf7vayvmfv8KqH2OpJRwXg_RGRUMuzE'};function cfg(){try{return {...DEFAULT_CFG,...JSON.parse(localStorage.getItem(CFG)||'{}')}}catch{return DEFAULT_CFG}}function toast(s){$('#toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#toast').innerHTML='',2800)}
function modal(title,body){$('#modal').innerHTML='<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h3>'+title+'</h3><button class="close" id="close">×</button></div>'+body+'</div></div>';$('#close').onclick=()=>$('#modal').innerHTML='';$('#back').onclick=e=>{if(e.target.id==='back')$('#modal').innerHTML=''}}
function late(t){return !['Concluído','Cancelado'].includes(t.status)&&t.date<today()}function pill(t){let c=t.status==='Concluído'?'done':late(t)?'late':t.status==='Em andamento'?'progress':t.status==='Aguardando'?'wait':'';return '<span class="pill '+c+'">'+(late(t)?'Atrasado':esc(t.status))+'</span>'}
async function audit(action,t){let {error}=await db.from('cp_history').insert({action,task_title:t.title||t.name||'Operador',task_type:t.type||null,operator_name:t.operator||t.name||null,created_at:new Date().toISOString()});if(error)console.warn(error)}
async function refresh(){if(!db||!session)return;try{let [a,b,c]=await Promise.all([db.from('cp_tasks').select('*').order('date').order('time'),db.from('cp_operators').select('*').order('name'),db.from('cp_history').select('*').order('created_at',{ascending:false}).limit(500)]);if(a.error)throw a.error;if(b.error)throw b.error;if(c.error)throw c.error;tasks=a.data||[];ops=(b.data||[]).map(x=>x.name);hist=c.data||[];render()}catch(e){toast('Erro ao carregar dados: '+e.message)}}
function head(t,d,add=true){return '<div class="head"><div><h2>'+t+'</h2><p>'+d+'</p></div>'+(add?'<button class="btn primary" id="new">＋ Nova tarefa</button>':'')+'</div>'}
function rows(arr){if(!arr.length)return '<div class="empty"><b>Nenhuma tarefa encontrada</b>Cadastre uma tarefa ou ajuste os filtros.</div>';return '<div class="tablewrap"><table><thead><tr><th>Tarefa / operação</th><th>Data / hora</th><th>Operador</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+arr.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).map(t=>'<tr><td><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.type)+(t.code?' · '+esc(t.code):'')+'</div></td><td>'+date(t.date)+'<div class="muted">'+esc(t.time||'Sem horário')+'</div></td><td>'+esc(t.operator||'Não atribuído')+'</td><td>'+esc(t.priority||'Normal')+'</td><td>'+pill(t)+'</td><td><button class="btn small" data-edit="'+t.id+'">Editar</button> <button class="btn small" data-status="'+t.id+'">'+(t.status==='Concluído'?'Reabrir':'Concluir')+'</button> <button class="btn small danger" data-del="'+t.id+'">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}
function filtered(){return tasks.filter(t=>(!search||[t.title,t.type,t.operator,t.code,t.notes].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!fs||t.status===fs||fs==='Atrasado'&&late(t))&&(!ft||t.type===ft)&&(!fo||t.operator===fo))}
function filters(){return '<div class="filters"><input class="search" id="search" placeholder="Buscar tarefa, operador, código..." value="'+esc(search)+'"><select id="fs" class="search"><option value="">Todos os status</option>'+[...ST,'Atrasado'].map(x=>'<option '+(fs===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="ft" class="search"><option value="">Todos os tipos</option>'+TYPES.map(x=>'<option '+(ft===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="fo" class="search"><option value="">Todos os operadores</option>'+ops.map(x=>'<option '+(fo===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}
function dashboard(){let pending=tasks.filter(t=>!['Concluído','Cancelado'].includes(t.status)),done=tasks.filter(t=>t.status==='Concluído');return head('Painel geral','Resumo das tarefas do centro de distribuição.')+'<div class="stats">'+[['Tarefas de hoje',tasks.filter(t=>t.date===today()&&t.status!=='Cancelado').length,'Programadas para hoje'],['Concluídas',done.length,(tasks.length?Math.round(done.length/tasks.length*100):0)+'% do total'],['Em andamento',tasks.filter(t=>t.status==='Em andamento').length,'Em execução'],['Atrasadas',tasks.filter(late).length,'Precisam de atenção']].map(x=>'<div class="stat"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('')+'</div><div class="panel"><div class="panelhead"><h3>Prioridades de hoje e atrasadas</h3><button class="btn small" data-goto="tasks">Ver todas</button></div>'+rows(pending.filter(t=>t.date<=today()||['Em andamento','Aguardando'].includes(t.status)).slice(0,8))+'</div><div class="panel"><div class="panelhead"><h3>Próximas tarefas · 7 dias</h3></div>'+rows(pending.filter(t=>t.date>=today()).slice(0,6))+'</div>'}
function taskPage(){return head('Tarefas','Cadastre, atribua e acompanhe as atividades.')+'<div class="panel">'+filters()+rows(filtered())+'</div>'}
function calendarPage(){let start=new Date(cursor),title;if(view==='month'){start=new Date(cursor.getFullYear(),cursor.getMonth(),1);start.setDate(start.getDate()-start.getDay());title=cursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}else if(view==='week'){start.setDate(start.getDate()-start.getDay());let end=new Date(start);end.setDate(end.getDate()+6);title=date(iso(start))+' – '+date(iso(end))}else title=date(iso(start));let out=head('Cronograma','Veja as tarefas por dia, semana ou mês.')+'<div class="panel"><div class="panelhead"><div class="viewtabs">'+['day','week','month'].map(x=>'<button data-view="'+x+'" class="'+(view===x?'active':'')+'">'+({day:'Dia',week:'Semana',month:'Mês'}[x])+'</button>').join('')+'</div><div class="datebar"><button class="btn small" id="prev">‹</button><strong>'+title+'</strong><button class="btn small" id="next">›</button><button class="btn small" id="now">Hoje</button></div></div>';
if(view==='day')out+=rows(tasks.filter(t=>t.date===iso(start)));else if(view==='week'){out+='<div class="weekscroll"><div class="week">'+Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let k=iso(d);return '<div class="weekday"><b>'+d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+'</b>'+tasks.filter(t=>t.date===k).map(t=>'<div class="weektask"><b>'+esc(t.time||'')+' '+esc(t.title)+'</b>'+esc(t.operator||'Sem operador')+'<br>'+pill(t)+'<br><button class="btn small" data-edit="'+t.id+'">Abrir</button></div>').join('')+'<button class="btn small" data-add="'+k+'">＋ Tarefa</button></div>'}).join('')+'</div></div>'}else{out+='<div class="calwrap"><div class="calendar">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dayhead">'+x+'</div>').join('')+Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d);return '<div class="day '+(d.getMonth()!==cursor.getMonth()?'out':'')+'"><b>'+d.getDate()+'</b>'+tasks.filter(t=>t.date===k).slice(0,4).map(t=>'<button class="event" data-edit="'+t.id+'">'+esc((t.time?t.time+' ':'')+t.title)+'</button>').join('')+'<button class="btn small" data-add="'+k+'">＋</button></div>'}).join('')+'</div></div>'}return out+'</div>'}
function operatorPage(){return head('Operadores','Equipe cadastrada para distribuição de tarefas.',false)+'<div class="panel"><div class="panelhead"><h3>Equipe do CD</h3><button id="newop" class="btn primary">＋ Novo operador</button></div>'+(!ops.length?'<div class="empty">Nenhum operador cadastrado.</div>':'<div class="ops">'+ops.map(o=>{let a=tasks.filter(t=>t.operator===o),d=a.filter(t=>t.status==='Concluído').length;return '<div class="op"><b>'+esc(o)+'</b><p class="muted">'+a.length+' tarefas · '+d+' concluídas</p><button class="btn small" data-op="'+esc(o)+'">Ver tarefas</button> <button class="btn small danger" data-remove="'+esc(o)+'">Remover</button></div>'}).join('')+'</div>')+'</div>'}
function historyPage(){return head('Histórico','Registro de alterações nas tarefas.',false)+'<div class="panel"><div class="panelhead"><h3>Atividades recentes</h3><button class="btn small" id="csv">Exportar tarefas CSV</button></div>'+(!hist.length?'<div class="empty">Ainda não há alterações registradas.</div>':hist.map(h=>'<div class="history"><b>'+esc(h.action)+'</b> — '+esc(h.task_title||h.operator_name||'Tarefa')+'<div class="muted">'+esc(h.task_type||'')+' '+(h.operator_name?'· '+esc(h.operator_name):'')+' · '+new Date(h.created_at).toLocaleString('pt-BR')+'</div></div>').join(''))+'</div>'}
function render(){if(!session)return;$('#auth').innerHTML='';$('#app').classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#main').innerHTML=({dashboard,tasks:taskPage,calendar:calendarPage,operators:operatorPage,history:historyPage}[page]||dashboard)();wire()}
function wire(){if($('#new'))$('#new').onclick=()=>editTask();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>editTask('',b.dataset.add));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});if($('#prev'))$('#prev').onclick=()=>{cursor=new Date(cursor);cursor.setDate(cursor.getDate()-(view==='day'?1:view==='week'?7:30));render()};if($('#next'))$('#next').onclick=()=>{cursor=new Date(cursor);cursor.setDate(cursor.getDate()+(view==='day'?1:view==='week'?7:30));render()};if($('#now'))$('#now').onclick=()=>{cursor=new Date();render()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>statusTask(b.dataset.status));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.del));if($('#newop'))$('#newop').onclick=editOperator;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeOperator(b.dataset.remove));document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{fo=b.dataset.op;page='tasks';render()});if($('#search'))$('#search').oninput=e=>{search=e.target.value;renderPreserve()};[['fs',v=>fs=v],['ft',v=>ft=v],['fo',v=>fo=v]].forEach(([id,fn])=>{if($('#'+id))$('#'+id).onchange=e=>{fn(e.target.value);render()}});if($('#csv'))$('#csv').onclick=exportCSV}
function renderPreserve(){let pos=$('#search')?.selectionStart;$('#main').innerHTML=taskPage();wire();if($('#search')){$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
function editTask(id='',preset=''){let t=id?tasks.find(x=>x.id===id):null;modal(t?'Editar tarefa':'Nova tarefa','<form id="taskform"><div class="grid"><div class="field full"><label>Nome da tarefa *</label><input name="title" required value="'+esc(t?.title||'')+'" placeholder="Ex.: Conferir carga"></div><div class="field"><label>Tipo de operação</label><select name="type">'+TYPES.map(x=>'<option '+((t?.type||TYPES[0])===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Código / NF / carga</label><input name="code" value="'+esc(t?.code||'')+'"></div><div class="field"><label>Data *</label><input name="date" type="date" required value="'+esc(t?.date||preset||today())+'"></div><div class="field"><label>Horário</label><input name="time" type="time" value="'+esc(t?.time||'')+'"></div><div class="field"><label>Operador</label><select name="operator"><option value="">Não atribuído</option>'+ops.map(o=>'<option '+((t?.operator||'')===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div><div class="field"><label>Prioridade</label><select name="priority">'+['Baixa','Normal','Alta','Urgente'].map(x=>'<option '+((t?.priority||'Normal')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Status</label><select name="status">'+ST.map(x=>'<option '+((t?.status||'A fazer')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Instruções / observações</label><textarea name="notes">'+esc(t?.notes||'')+'</textarea></div></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Salvar tarefa</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#taskform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p={title:f.get('title').trim(),type:f.get('type'),code:f.get('code').trim(),date:f.get('date'),time:f.get('time')||null,operator:f.get('operator')||null,priority:f.get('priority'),status:f.get('status'),notes:f.get('notes').trim(),updated_at:new Date().toISOString()};try{let res;if(t)res=await db.from('cp_tasks').update(p).eq('id',t.id);else{p.created_by=session.user.id;p.created_at=new Date().toISOString();p.completed_at=p.status==='Concluído'?new Date().toISOString():null;res=await db.from('cp_tasks').insert(p)}if(res.error)throw res.error;await audit(t?'Tarefa editada':'Tarefa criada',p);$('#modal').innerHTML='';await refresh();toast('Tarefa salva e sincronizada.')}catch(err){toast('Falha ao salvar: '+err.message)}}}
async function statusTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;let status=t.status==='Concluído'?'A fazer':'Concluído';try{let {error}=await db.from('cp_tasks').update({status,completed_at:status==='Concluído'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await audit(status==='Concluído'?'Tarefa concluída':'Tarefa reaberta',{...t,status});await refresh()}catch(e){toast(e.message)}}
async function deleteTask(id){let t=tasks.find(x=>x.id===id);if(!t||!confirm('Excluir “'+t.title+'”?'))return;try{let {error}=await db.from('cp_tasks').delete().eq('id',id);if(error)throw error;await audit('Tarefa excluída',t);await refresh()}catch(e){toast(e.message)}}
function editOperator(){modal('Novo operador','<form id="opform"><div class="field"><label>Nome completo *</label><input name="name" required></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Adicionar</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#opform').onsubmit=async e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(ops.some(o=>o.toLowerCase()===name.toLowerCase()))return toast('Operador já cadastrado.');let {error}=await db.from('cp_operators').insert({name,created_by:session.user.id});if(error)return toast(error.message);await audit('Operador cadastrado',{name});$('#modal').innerHTML='';await refresh()}}
async function removeOperator(name){if(tasks.some(t=>t.operator===name&&!['Concluído','Cancelado'].includes(t.status)))return alert('Reatribua as tarefas pendentes antes de remover.');if(!confirm('Remover '+name+'?'))return;let {error}=await db.from('cp_operators').delete().eq('name',name);if(error)return toast(error.message);await audit('Operador removido',{name});await refresh()}
function exportCSV(){let rows=[['Tarefa','Tipo','Código','Data','Hora','Operador','Prioridade','Status','Observações'],...tasks.map(t=>[t.title,t.type,t.code,t.date,t.time,t.operator,t.priority,t.status,t.notes])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='conferente-pro-tarefas.csv';a.click();URL.revokeObjectURL(a.href)}
function settings(){let c=cfg();modal('Conectar banco compartilhado','<p class="muted">Insira a URL e a chave pública (publishable/anon) de um projeto Supabase do CONFERENTE PRO. Nunca cole a chave service_role. O arquivo supabase-schema.sql cria as tabelas necessárias.</p><form id="cfg"><div class="field"><label>URL do projeto</label><input name="url" type="url" required placeholder="https://projeto.supabase.co" value="'+esc(c.url||'')+'"></div><div class="field" style="margin-top:12px"><label>Chave pública</label><input name="key" required value="'+esc(c.key||'')+'"></div><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Conectar</button></div></form>');$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#cfg').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);localStorage.setItem(CFG,JSON.stringify({url:f.get('url').trim().replace(/\/$/,''),key:f.get('key').trim()}));$('#modal').innerHTML='';await connect()}}
function showLogin(){ $('#app').classList.add('hidden');$('#logout').classList.add('hidden');$('#auth').innerHTML='<div class="auth"><h2>Entrar no CONFERENTE PRO</h2><p class="muted">Use uma conta individual para acessar as mesmas tarefas compartilhadas da equipe.</p><form id="login"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><div class="actions" style="justify-content:flex-start"><button class="btn primary">Entrar</button><button type="button" class="btn" id="signup">Criar conta</button></div></form><p class="muted" id="msg"></p><button class="btn small" id="config">⚙ Configurar banco</button></div>';$('#config').onclick=settings;$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});$('#msg').textContent=error?error.message:'Entrando…'};$('#signup').onclick=async()=>{let f=new FormData($('#login'));if(!f.get('email')||!f.get('password'))return $('#msg').textContent='Preencha e-mail e senha.';let {error}=await db.auth.signUp({email:f.get('email'),password:f.get('password')});$('#msg').textContent=error?error.message:'Conta criada. Se solicitado, confirme o e-mail e entre.'}}
async function connect(){let c=cfg();if(!c.url||!c.key||!window.supabase){$('#auth').innerHTML='<div class="auth"><h2>Configuração necessária</h2><p>Para o sistema funcionar entre celulares e computadores, conecte um banco compartilhado.</p><button id="setup" class="btn primary">Configurar conexão</button><p class="muted">O site precisa de um projeto Supabase e das tabelas do arquivo supabase-schema.sql.</p></div>';$('#setup').onclick=settings;return}try{db=window.supabase.createClient(c.url,c.key);let {data,error}=await db.auth.getSession();if(error)throw error;session=data.session;db.auth.onAuthStateChange((_e,s)=>{session=s;if(s){$('#auth').innerHTML='';refresh()}else showLogin()});if(session){$('#auth').innerHTML='';$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await refresh()}else showLogin();$('#logout').onclick=async()=>{await db.auth.signOut();session=null;showLogin()}}catch(e){$('#auth').innerHTML='<div class="auth"><h2>Erro de conexão</h2><p>'+esc(e.message)+'</p><button id="again" class="btn primary">Tentar novamente</button></div>';$('#again').onclick=connect}}
$('#settings').onclick=settings;connect();
})();
</script></body></html>
