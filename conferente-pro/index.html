<head>

<style>
:root{--navy:#10243a;--navy2:#173b59;--blue:#2d7ff9;--bg:#f3f6fa;--card:#fff;--text:#172536;--muted:#66778a;--line:#e2e9f0;--green:#14865c;--amber:#b96c09;--red:#c43d46;--shadow:0 8px 28px #19314a0c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{min-height:100vh}.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:white;padding:20px clamp(16px,4vw,42px);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:#ffffff18;display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;letter-spacing:.4px;margin:0}.brand p{margin:4px 0 0;color:#c5d5e4;font-size:12px}.topdate{font-size:13px;color:#d7e4ef;text-align:right}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 84px)}aside{padding:22px 14px;background:#fff;border-right:1px solid var(--line)}.navlabel{font-size:10px;letter-spacing:1.4px;color:#8b9aaa;font-weight:800;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#526276;padding:12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:11px;font-weight:650}.nav button.active,.nav button:hover{background:#eaf2ff;color:#1c62bf}.nav .ico{width:22px;text-align:center;font-size:17px}.sidehint{margin:26px 8px 0;padding:14px;background:#f2f6fb;border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}.main{padding:clamp(16px,3vw,32px);min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}.pagehead h2{font-size:clamp(22px,3vw,29px);margin:0 0 6px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--text);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:7px 9px;font-size:12px}.btn.danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:650}.stat .value{font-size:30px;font-weight:850;margin:8px 0 3px}.stat .sub{font-size:11px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.panelhead h3{font-size:16px;margin:0}.muted{color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#4b5d70}.field input,.field select,.field textarea,.search{width:100%;min-width:0;border:1px solid #d6e0ea;border-radius:9px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2d7ff91c}.field textarea{resize:vertical;min-height:76px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.formactions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:17px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #edf1f5;font-size:13px;vertical-align:middle}th{font-size:11px;color:#78899a;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc}tbody tr:last-child td{border-bottom:0}.tasktitle{font-weight:750;margin-bottom:5px}.subline{font-size:11px;color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap;background:#eef2f6;color:#586779}.pill.todo{background:#fff2d9;color:#995a00}.pill.progress{background:#e5f0ff;color:#205fb0}.pill.done{background:#dcf7e9;color:#13754e}.pill.late{background:#ffe6e7;color:#b52b36}.priority{font-size:11px;font-weight:800}.priority.Urgente,.priority.Alta{color:var(--red)}.priority.Normal{color:#9a6a10}.priority.Baixa{color:var(--muted)}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}.viewtabs{display:flex;gap:5px;background:#edf2f7;padding:4px;border-radius:10px}.viewtabs button{border:0;background:transparent;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:750;color:#68788a}.viewtabs button.active{background:white;color:#1b5caa;box-shadow:0 1px 4px #10243a12}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:10px;overflow:hidden}.dayhead{font-size:11px;text-align:center;padding:9px 3px;color:var(--muted);background:#f7f9fc;font-weight:800}.daycell{min-height:100px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}.daycell.out{background:#f8fafc;color:#aeb8c2}.daynum{font-size:11px;font-weight:800;margin-bottom:6px}.event{display:block;border:0;border-radius:5px;padding:5px;margin:3px 0;width:100%;text-align:left;font-size:10px;line-height:1.3;background:#e5efff;color:#235da5;overflow-wrap:anywhere}.event.done{background:#dcf7e9;color:#13754e}.event.late{background:#ffe6e7;color:#b52b36}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekcol{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}.weekcol h4{font-size:11px;margin:3px 0 9px;color:#607286}.weektask{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);padding:8px;border-radius:7px;margin-bottom:7px;font-size:11px;overflow-wrap:anywhere}.weektask.done{border-left-color:var(--green)}.weektask b{display:block;margin-bottom:4px}.operatorgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.opcard{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.opname{font-weight:800}.opcount{font-size:12px;color:var(--muted);margin:5px 0 12px}.progressbar{height:6px;background:#e9eff5;border-radius:8px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--green)}.optask{font-size:12px;padding:10px 0;border-top:1px solid #edf1f5}.optask small{display:block;color:var(--muted);margin-top:4px}.historyrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f5}.historyrow:last-child{border-bottom:0}.historyicon{width:32px;height:32px;border-radius:50%;background:#e0f7eb;color:var(--green);display:grid;place-items:center;flex-shrink:0}.mobilebottom{display:none}.hidden{display:none!important}.notice{font-size:12px;color:#7b5a19;background:#fff7e5;border:1px solid #f2dfb3;padding:12px;border-radius:10px;line-height:1.5}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172536;color:white;border-radius:10px;padding:12px 18px;z-index:20;box-shadow:var(--shadow);max-width:90vw;font-size:13px}.modalback{position:fixed;inset:0;background:#0b192bb3;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:20px}.close{border:0;background:#eef2f6;border-radius:9px;width:38px;height:38px;font-size:20px}.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.datebar strong{min-width:145px;text-align:center;font-size:13px}
@media(max-width:950px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.operatorgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -5px 20px #10243a0a}.mobilebottom button{border:0;background:transparent;color:#6b7c8f;font-size:10px;font-weight:750;padding:7px 2px;display:flex;flex-direction:column;gap:4px;align-items:center}.mobilebottom button.active{color:#1c62bf}.mobilebottom span{font-size:18px}.main{padding-bottom:100px}.top{padding:15px 17px}.topdate{font-size:11px}.weekgrid{grid-template-columns:repeat(7,minmax(88px,1fr));overflow-x:auto}.calendar{min-width:560px}.panel.calendarpanel{overflow-x:auto}}
@media(max-width:560px){.brand h1{font-size:17px}.brand p{font-size:11px}.logo{width:39px;height:39px}.topdate{max-width:110px;line-height:1.4}.stats{gap:9px}.stat{padding:13px;border-radius:12px}.stat .value{font-size:25px}.stat .label{font-size:11px}.main{padding:16px 12px 100px}.panel{padding:14px;border-radius:12px}.pagehead{margin-bottom:16px}.pagehead p{font-size:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.operatorgrid{grid-template-columns:1fr}.daycell{min-height:75px;padding:4px}.daynum{font-size:10px}.event{font-size:9px;padding:4px}.panelhead{align-items:flex-start}.filters>*{flex:1}.filters input{min-width:130px}.btn{padding:10px 12px}.modal{padding:17px}.modalback{padding:8px}.datebar{justify-content:center}.datebar strong{min-width:125px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">▦</div><div><h1>CONFERENTE PRO</h1><p>Controle de operações e tarefas</p></div></div><div class="topdate" id="todayLabel"></div></header>
<div class="layout"><aside><div class="navlabel">OPERAÇÃO</div><nav class="nav" id="sidenav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>Painel geral</button><button data-page="tasks"><span class="ico">☷</span>Todas as tarefas</button><button data-page="calendar"><span class="ico">▦</span>Cronograma</button><button data-page="operators"><span class="ico">♙</span>Operadores</button><button data-page="history"><span class="ico">↺</span>Histórico</button>
</nav><div class="sidehint"><b>Um CD · Uma operação</b><br>Organize cross-dockings, transferências e rotinas da expedição em um só lugar.</div></aside>
<main class="main" id="main"></main></div>
<nav class="mobilebottom" id="mobileNav"><button class="active" data-page="dashboard"><span>▦</span>Painel</button><button data-page="tasks"><span>☷</span>Tarefas</button><button data-page="calendar"><span>▦</span>Agenda</button><button data-page="operators"><span>♙</span>Equipe</button><button data-page="history"><span>↺</span>Histórico</button></nav>
</div><div id="modalroot"></div><div id="toastroot"></div>
<script>
(function(){
const KEY='conferente-pro-v1';
const TYPES=['Cross-docking','Transferências de estoque','Separação de materiais','Conferência de cargas','Carregamento e expedição','Outra tarefa'];
const STATUSES=['A fazer','Em andamento','Aguardando','Concluído','Atrasado','Cancelado'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const today=()=>localISO(new Date());
const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const timeFmt=s=>s||'—';
let state={page:'dashboard',view:'week',cursor:new Date(),search:'',filterStatus:'',filterType:'',filterOperator:'',tasks:[],operators:[],history:[]};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');state.tasks=x.tasks||[];state.operators=x.operators||[];state.history=x.history||[];}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,operators:state.operators,history:state.history}));}
function toast(s){$('#toastroot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#toastroot').innerHTML='',2600)}
function log(action,t,detail=''){state.history.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),action,title:t.title||'Operador',type:t.type||'',operator:t.operator||'',date:new Date().toISOString(),detail});}
function isLate(t){return t.status!=='Concluído'&&t.status!=='Cancelado'&&t.date<today()}
function statusClass(t){if(t.status==='Concluído')return'done';if(isLate(t)||t.status==='Atrasado')return'late';if(t.status==='Em andamento')return'progress';return'todo'}
function pill(t){return '<span class="pill '+statusClass(t)+'">'+esc(isLate(t)?'Atrasado':t.status)+'</span>'}
function taskById(id){return state.tasks.find(t=>t.id===id)}
function filtered(){return state.tasks.filter(t=>(!state.search||[t.title,t.type,t.operator,t.notes,t.code].join(' ').toLowerCase().includes(state.search.toLowerCase()))&&(!state.filterStatus||t.status===state.filterStatus)&&(!state.filterType||t.type===state.filterType)&&(!state.filterOperator||t.operator===state.filterOperator))}
function setPage(p){state.page=p;render()}
function head(title,desc,action=true){return '<div class="pagehead"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+(action?'<button class="btn primary" id="newTask">＋ Nova tarefa</button>':'')+'</div>'}
function stat(label,val,sub,ico){return '<div class="stat"><div class="label">'+ico+'　'+label+'</div><div class="value">'+val+'</div><div class="sub">'+sub+'</div></div>'}
function taskRows(tasks){if(!tasks.length)return '<div class="empty"><strong>Nenhuma tarefa encontrada</strong>Cadastre uma tarefa ou ajuste os filtros.</div>';return '<div class="tablewrap"><table><thead><tr><th>Atividade</th><th>Data / horário</th><th>Responsável</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>'<tr><td><div class="tasktitle">'+esc(t.title)+'</div><div class="subline">'+esc(t.type)+(t.code?' · '+esc(t.code):'')+'</div></td><td>'+dateFmt(t.date)+'<div class="subline">'+timeFmt(t.time)+'</div></td><td>'+esc(t.operator||'Não atribuído')+'</td><td><span class="priority '+esc(t.priority)+'">'+esc(t.priority)+'</span></td><td>'+pill(t)+'</td><td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn small" data-edit="'+t.id+'">Editar</button>'+(t.status!=='Concluído'?'<button class="btn small" data-done="'+t.id+'">✓ Feita</button>':'<button class="btn small" data-reopen="'+t.id+'">Reabrir</button>')+'</div></td></tr>').join('')+'</tbody></table></div>'}
function filterbar(){return '<div class="filters" style="margin-bottom:14px"><input class="search" id="search" placeholder="Buscar tarefa, operador ou código..." value="'+esc(state.search)+'" style="flex:2;min-width:180px"><select id="filterStatus" class="search"><option value="">Todos os status</option>'+STATUSES.map(s=>'<option '+(state.filterStatus===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="filterType" class="search"><option value="">Todos os tipos</option>'+TYPES.map(s=>'<option '+(state.filterType===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="filterOperator" class="search"><option value="">Todos os operadores</option>'+state.operators.map(s=>'<option '+(state.filterOperator===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div>'}
function dashboard(){const ts=state.tasks;const pending=ts.filter(t=>!['Concluído','Cancelado'].includes(t.status));const done=ts.filter(t=>t.status==='Concluído');const todayTasks=ts.filter(t=>t.date===today());const late=ts.filter(isLate);const rate=ts.length?Math.round(done.length/ts.length*100):0;return head('Painel geral','Resumo das tarefas e prioridades do CD.')+'<div class="stats">'+stat('Tarefas de hoje',todayTasks.length,'Programadas para hoje','◷')+stat('Concluídas',done.length,rate+'% do total','✓')+stat('Em andamento',ts.filter(t=>t.status==='Em andamento').length,'Atividades em execução','↗')+stat('Atrasadas',late.length,'Precisam de atenção','!')+'</div><div class="panel"><div class="panelhead"><h3>Prioridades e tarefas pendentes</h3><button class="btn small" data-goto="tasks">Ver todas →</button></div>'+taskRows(pending.filter(t=>t.date<=today()||t.status==='Em andamento'||t.status==='Aguardando').slice(0,8))+'</div><div class="panel"><div class="panelhead"><h3>Próximas atividades</h3><span class="muted" style="font-size:12px">Próximos 7 dias</span></div>'+taskRows(pending.filter(t=>t.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6))+'</div>'}
function tasksPage(){return head('Todas as tarefas','Cadastre, distribua e atualize cada atividade.')+'<div class="panel">'+filterbar()+taskRows(filtered())+'</div>'}
function monthTitle(d){return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function moveCursor(n){if(state.view==='month')state.cursor.setMonth(state.cursor.getMonth()+n);else state.cursor.setDate(state.cursor.getDate()+n*(state.view==='week'?7:1));render()}
function calendarPage(){const d=new Date(state.cursor);let label='';let start,end;if(state.view==='month'){label=monthTitle(d);start=new Date(d.getFullYear(),d.getMonth(),1);const offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);end=new Date(start);end.setDate(start.getDate()+41)}else if(state.view==='week'){const offset=(d.getDay()+6)%7;start=new Date(d);start.setDate(d.getDate()-offset);end=new Date(start);end.setDate(start.getDate()+6);label=dateFmt(localISO(start))+' – '+dateFmt(localISO(end))}else{start=new Date(d);end=new Date(d);label=start.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}
const days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let html=head('Cronograma','Planeje o trabalho por dia, semana ou mês.')+'<div class="panel"><div class="panelhead"><div class="viewtabs">'+['day','week','month'].map((v,i)=>'<button data-view="'+v+'" class="'+(state.view===v?'active':'')+'">'+['Dia','Semana','Mês'][i]+'</button>').join('')+'</div><div class="datebar"><button class="btn small" id="prev">‹</button><strong>'+esc(label)+'</strong><button class="btn small" id="next">›</button><button class="btn small" id="todayBtn">Hoje</button></div></div>';
if(state.view==='month'){html+='<div class="calendarpanel" style="overflow-x:auto"><div class="calendar">'+days.map(x=>'<div class="dayhead">'+x+'</div>').join('');for(let i=0;i<42;i++){const day=new Date(start);day.setDate(start.getDate()+i);const iso=localISO(day);const arr=state.tasks.filter(t=>t.date===iso);html+='<div class="daycell '+(day.getMonth()!==d.getMonth()?'out':'')+'"><div class="daynum">'+day.getDate()+'</div>'+arr.slice(0,3).map(t=>'<button class="event '+(t.status==='Concluído'?'done':isLate(t)?'late':'')+'" data-edit="'+t.id+'">'+esc(t.time?t.time+' ':'')+esc(t.title)+'</button>').join('')+(arr.length>3?'<div class="subline">+'+(arr.length-3)+' tarefas</div>':'')+'</div>'}html+='</div></div>'}
else if(state.view==='week'){html+='<div class="weekgrid">'+days.map((day,i)=>{const dt=new Date(start);dt.setDate(start.getDate()+i);const iso=localISO(dt);return '<div class="weekcol"><h4>'+day+' · '+dt.getDate()+'</h4>'+state.tasks.filter(t=>t.date===iso).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(t=>'<button class="weektask '+(t.status==='Concluído'?'done':'')+'" data-edit="'+t.id+'"><b>'+esc(t.time||'Sem hora')+'</b>'+esc(t.title)+'<div class="subline">'+esc(t.operator||'Sem responsável')+'</div></button>').join('')+'<button class="btn small" data-adddate="'+iso+'" style="width:100%">＋</button></div>'}).join('')+'</div>'}
else{const iso=localISO(start);html+='<div style="margin-bottom:14px">'+taskRows(state.tasks.filter(t=>t.date===iso))+'</div><button class="btn" data-adddate="'+iso+'">＋ Adicionar tarefa neste dia</button>'}
html+='</div>';return html}
function operatorsPage(){return head('Operadores','Cadastre a equipe e acompanhe as tarefas atribuídas.',false)+'<div class="panel"><div class="panelhead"><h3>Equipe do CD</h3><button class="btn primary" id="addOperator">＋ Adicionar operador</button></div>'+(state.operators.length?'<div class="operatorgrid">'+state.operators.map(op=>{const ts=state.tasks.filter(t=>t.operator===op);const done=ts.filter(t=>t.status==='Concluído').length;return '<div class="opcard"><div class="opname">♙ '+esc(op)+'</div><div class="opcount">'+ts.length+' tarefa(s) · '+done+' concluída(s)</div><div class="progressbar"><span style="width:'+(ts.length?done/ts.length*100:0)+'%"></span></div><div style="margin-top:12px">'+(ts.length?ts.filter(t=>t.status!=='Concluído').slice(0,4).map(t=>'<div class="op task"><div class="opname" style="font-size:12px">'+esc(t.title)+'</div><small>'+dateFmt(t.date)+' · '+esc(t.status)+'</small></div>').join(''):'<div class="muted" style="font-size:12px;margin-top:10px">Nenhuma tarefa atribuída.</div>')+'</div><button class="btn small danger" style="margin-top:12px" data-removeop="'+esc(op)+'">Remover operador</button></div>'}).join('')+'</div>':'<div class="empty"><strong>Nenhum operador cadastrado</strong>Adicione os nomes da equipe para distribuir as tarefas.</div>')+'</div><div class="notice">Os dados desta versão ficam salvos neste navegador. Para compartilhar a mesma lista entre celulares e computadores, será necessário conectar um banco de dados online e configurar o acesso dos usuários.</div>'}
function historyPage(){return head('Histórico','Registro das alterações e tarefas concluídas.',false)+'<div class="panel"><div class="panelhead"><h3>Atividades recentes</h3><span class="muted" style="font-size:12px">'+state.history.length+' registro(s)</span></div>'+(state.history.length?state.history.map(h=>'<div class="historyrow"><div class="historyicon">✓</div><div style="min-width:0;flex:1"><div style="font-weight:750;font-size:13px">'+esc(h.action)+' · '+esc(h.title)+'</div><div class="muted" style="font-size:12px;margin-top:4px">'+esc(h.type)+' '+(h.operator?'· '+esc(h.operator):'')+'</div><div class="muted" style="font-size:11px;margin-top:4px">'+new Date(h.date).toLocaleString('pt-BR')+(h.detail?' · '+esc(h.detail):'')+'</div></div></div>').join(''):'<div class="empty"><strong>O histórico está vazio</strong>As alterações aparecerão aqui quando você começar a usar o sistema.</div>')+'</div>'}
function render(){const p=state.page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#todayLabel').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});$('#main').innerHTML=({dashboard,tasks:tasksPage,calendar:calendarPage,operators:operatorsPage,history:historyPage}[p]||dashboard)();wire()}
function openTask(id='',date=''){const t=id?taskById(id):null;const title=t?'Editar tarefa':'Nova tarefa';$('#modalroot').innerHTML='<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h3>'+title+'</h3><button class="close" id="closeModal" aria-label="Fechar">×</button></div><form id="taskForm"><div class="formgrid"><div class="field full"><label for="title">Nome da atividade *</label><input id="title" name="title" required maxlength="120" value="'+esc(t?.title||'')+'" placeholder="Ex.: Cross-docking CD-0245"></div><div class="field"><label for="type">Tipo de operação *</label><select id="type" name="type">'+TYPES.map(s=>'<option '+((t?.type||TYPES[0])===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label for="code">Código / referência</label><input id="code" name="code" value="'+esc(t?.code||'')+'" placeholder="Ex.: TR-018"></div><div class="field"><label for="date">Data *</label><input id="date" name="date" type="date" required value="'+esc(t?.date||date||today())+'"></div><div class="field"><label for="time">Horário previsto</label><input id="time" name="time" type="time" value="'+esc(t?.time||'')+'"></div><div class="field"><label for="operator">Operador responsável</label><select id="operator" name="operator"><option value="">Não atribuído</option>'+state.operators.map(o=>'<option '+((t?.operator||'')===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div><div class="field"><label for="priority">Prioridade</label><select id="priority" name="priority">'+['Baixa','Normal','Alta','Urgente'].map(s=>'<option '+((t?.priority||'Normal')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label for="status">Status</label><select id="status" name="status">'+STATUSES.map(s=>'<option '+((t?.status||'A fazer')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field full"><label for="notes">Observações</label><textarea id="notes" name="notes" placeholder="Detalhes da operação, materiais ou instruções">'+esc(t?.notes||'')+'</textarea></div></div><div class="formactions">'+(t?'<button type="button" class="btn danger" id="deleteTask">Excluir</button>':'')+'<button type="button" class="btn" id="cancelModal">Cancelar</button><button type="submit" class="btn primary">Salvar tarefa</button></div></form></section></div>';
const close=()=>$('#modalroot').innerHTML='';$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')close()});$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const data=Object.fromEntries(f.entries());if(!data.title.trim())return;const old=t?{...t}:null;const task={...(old||{}),...data,id:t?.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),createdAt:t?.createdAt||new Date().toISOString(),completedAt:data.status==='Concluído'?(t?.completedAt||new Date().toISOString()):''};if(t){state.tasks=state.tasks.map(x=>x.id===t.id?task:x);log('Tarefa atualizada',task.title,task.status)}else{state.tasks.push(task);log('Tarefa criada',task.title,task.status)}if(data.status==='Concluído'&&old?.status!=='Concluído')task.completedAt=new Date().toISOString();save();close();render();toast('Tarefa salva com sucesso')};if(t)$('#deleteTask').onclick=()=>{if(confirm('Excluir esta tarefa?')){log('Tarefa excluída',t.title);state.tasks=state.tasks.filter(x=>x.id!==t.id);save();close();render();toast('Tarefa excluída')}};setTimeout(()=>$('#title').focus(),40)}
function addOperator(){const name=prompt('Nome do operador:');if(!name||!name.trim())return;const n=name.trim();if(state.operators.some(o=>o.toLowerCase()===n.toLowerCase()))return toast('Este operador já está cadastrado');state.operators.push(n);log('Operador cadastrado',{title:n});save();render();toast('Operador adicionado')}
function wire(){const nt=$('#newTask');if(nt)nt.onclick=()=>openTask();const add=$('#addOperator');if(add)add.onclick=addOperator;const prev=$('#prev');if(prev)prev.onclick=()=>moveCursor(-1);const next=$('#next');if(next)next.onclick=()=>moveCursor(1);const tb=$('#todayBtn');if(tb)tb.onclick=()=>{state.cursor=new Date();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.edit));document.querySelectorAll('[data-adddate]').forEach(b=>b.onclick=()=>openTask('',b.dataset.adddate));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=taskById(b.dataset.done);if(!t)return;t.status='Concluído';t.completedAt=new Date().toISOString();log('Tarefa concluída',t.title);save();render();toast('Tarefa marcada como concluída')});document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{const t=taskById(b.dataset.reopen);if(t){t.status='A fazer';t.completedAt='';log('Tarefa reaberta',t.title);save();render();toast('Tarefa reaberta')}});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));document.querySelectorAll('[data-removeop]').forEach(b=>b.onclick=()=>{const op=b.dataset.removeop;if(state.tasks.some(t=>t.operator===op&&!['Concluído','Cancelado'].includes(t.status)))return alert('Este operador tem tarefas pendentes. Reatribua-as antes de remover.');if(confirm('Remover o operador '+op+'?')){state.operators=state.operators.filter(o=>o!==op);log('Operador removido',{title:op});save();render()}});const s=$('#search');if(s)s.oninput=()=>{state.search=s.value;const pos=s.selectionStart;const wrap=s.closest('.panel');const scroll=window.scrollY;const result=taskRows(filtered());const old=wrap.querySelector('.tablewrap,.empty');if(old)old.outerHTML=result;wireTaskActions();window.scrollTo(0,scroll);s.focus();s.setSelectionRange(pos,pos)};[['filterStatus','filterStatus'],['filterType','filterType'],['filterOperator','filterOperator']].forEach(([id,key])=>{const el=$('#'+id);if(el)el.onchange=()=>{state[key]=el.value;render()}})}
function wireTaskActions(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=taskById(b.dataset.done);if(t){t.status='Concluído';t.completedAt=new Date().toISOString();log('Tarefa concluída',t.title);save();render()}});document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{const t=taskById(b.dataset.reopen);if(t){t.status='A fazer';save();render()}})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
load();render();
})();
</script></body></html>
